<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Ring with Islamic Octagram Shape -->
  <g filter="url(#shadow)">
    <!-- 8-pointed star base -->
    <rect x="50" y="50" width="400" height="400" rx="30" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="8" transform="rotate(0 250 250)"/>
    <rect x="50" y="50" width="400" height="400" rx="30" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="8" transform="rotate(45 250 250)"/>
    
    <!-- Central Circle -->
    <circle cx="250" cy="250" r="185" fill="#043c2e" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="250" cy="250" r="175" fill="none" stroke="#FCD34D" stroke-dasharray="6,4" stroke-width="2"/>
  </g>

  <!-- 9 Stars of Walisongo arranged in an arc on top -->
  <g fill="url(#goldGrad)">
    <!-- Top central big star -->
    <polygon points="250,90 255,103 268,103 257,111 261,124 250,116 239,124 243,111 232,103 245,103" />
    
    <!-- Left stars -->
    <polygon points="215,96 219,106 230,106 221,113 224,123 215,117 206,123 209,113 200,106 211,106" />
    <polygon points="182,112 186,122 197,122 188,129 191,139 182,133 173,139 176,129 167,122 178,122" />
    <polygon points="155,138 159,148 170,148 161,155 164,165 155,159 146,165 149,155 140,148 151,148" />
    <polygon points="135,172 139,182 150,182 141,189 144,199 135,193 126,199 129,189 120,182 131,182" />
    
    <!-- Right stars -->
    <polygon points="285,96 289,106 300,106 291,113 294,123 285,117 276,123 279,113 270,106 281,106" />
    <polygon points="318,112 322,122 333,122 324,129 327,139 318,133 309,139 312,129 303,122 314,122" />
    <polygon points="345,138 349,148 360,148 351,155 354,165 345,159 336,165 339,155 330,148 341,148" />
    <polygon points="365,172 369,182 380,182 371,189 374,199 365,193 356,199 359,189 350,182 361,182" />
  </g>

  <!-- Mosque Dome and Minarets -->
  <g fill="url(#goldGrad)" opacity="0.95">
    <!-- Center Dome -->
    <path d="M 210 240 C 210 185, 250 155, 250 155 C 250 155, 290 185, 290 240 Z" fill="#10B981"/>
    <path d="M 220 240 C 220 195, 250 170, 250 170 C 250 170, 280 195, 280 240 Z" fill="url(#goldGrad)"/>
    <!-- Dome Crescent & Star Finial -->
    <path d="M 250 142 A 8 8 0 1 1 254 156 A 6 6 0 1 0 250 142 Z" fill="#FCD34D"/>
    <!-- Left Minaret -->
    <rect x="175" y="195" width="14" height="45" rx="2" fill="url(#goldGrad)"/>
    <polygon points="172,195 182,175 192,195"/>
    <!-- Right Minaret -->
    <rect x="311" y="195" width="14" height="45" rx="2" fill="url(#goldGrad)"/>
    <polygon points="308,195 318,175 328,195"/>
  </g>

  <!-- Holy Qur'an with Radiance -->
  <g filter="url(#shadow)">
    <!-- Quran book stand / Rehal -->
    <polygon points="220,315 250,295 280,315 260,325 250,315 240,325" fill="#78350F"/>
    
    <!-- Open Book Pages (Al-Qur'an) -->
    <!-- Left Page -->
    <path d="M 250 285 C 225 270, 190 270, 175 280 L 175 245 C 190 235, 225 235, 250 250 Z" fill="#F8FAFC" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Right Page -->
    <path d="M 250 285 C 275 270, 310 270, 325 280 L 325 245 C 310 235, 275 235, 250 250 Z" fill="#F8FAFC" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Arabic Calligraphy lines hint -->
    <path d="M 190 250 Q 215 248 238 258 M 190 260 Q 215 258 238 268 M 190 270 Q 215 268 238 276" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <path d="M 262 258 Q 285 248 310 250 M 262 268 Q 285 258 310 260 M 262 276 Q 285 268 310 270" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Circular Text inside Seal -->
  <path id="textArcTop" d="M 100 250 A 150 150 0 1 1 400 250" fill="none"/>
  <path id="textArcBottom" d="M 400 250 A 150 150 0 0 1 100 250" fill="none"/>
  
  <text fill="#FEF08A" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="19" letter-spacing="3.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      SMP ISLAM WALISONGO 2
    </textPath>
  </text>

  <!-- Golden Ribbon Banner on Bottom -->
  <g filter="url(#shadow)">
    <!-- Ribbon ends -->
    <polygon points="65,395 105,375 105,420 65,425" fill="#B45309"/>
    <polygon points="435,395 395,375 395,420 435,425" fill="#B45309"/>
    
    <!-- Ribbon body -->
    <path d="M 95 385 C 170 370, 330 370, 405 385 L 395 425 C 325 410, 175 410, 105 425 Z" fill="url(#goldGrad)" stroke="#FEF08A" stroke-width="2"/>
    
    <text x="250" y="405" fill="#064E3B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="2">
      KOTA DEPOK
    </text>
    <text x="250" y="420" fill="#043C2E" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="1.5">
      YAYASAN PP. HJ. DARDJAH AMIN
    </text>
  </g>
</svg>
