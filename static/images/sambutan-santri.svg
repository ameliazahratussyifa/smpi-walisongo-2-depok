<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRoom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#044e3f"/>
      <stop offset="40%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background Wall with Islamic Arch Silhouette -->
  <rect width="800" height="500" rx="20" fill="url(#bgRoom)"/>
  
  <!-- Subtle Islamic Arch Motif in Background -->
  <path d="M 250 500 L 250 250 C 250 120, 400 80, 400 80 C 400 80, 550 120, 550 250 L 550 500 Z" fill="#03382c" opacity="0.6"/>
  <circle cx="400" cy="200" r="90" fill="none" stroke="#10b981" stroke-width="2" opacity="0.25" stroke-dasharray="8,6"/>
  
  <!-- Smart Board / Digital Classroom Screen in Center -->
  <rect x="220" y="110" width="360" height="210" rx="12" fill="#0f2922" stroke="url(#glowG)" stroke-width="3"/>
  <!-- Screen Glow Content -->
  <rect x="235" y="125" width="330" height="180" rx="8" fill="#06382a"/>
  
  <!-- Content on Smart Screen -->
  <circle cx="400" cy="180" r="32" fill="#10b981" opacity="0.3"/>
  <text x="400" y="175" fill="#fde68a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" text-anchor="middle">DIGITAL SMART SCHOOL</text>
  <text x="400" y="195" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" text-anchor="middle">SMP Islam Walisongo 2 Depok</text>
  <line x1="280" y1="215" x2="520" y2="215" stroke="#10b981" stroke-width="2" opacity="0.4"/>
  <text x="400" y="240" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Tahfidzul Qur'an • Kurikulum Merdeka • Coding Lab</text>

  <!-- Classroom Table / Podium -->
  <path d="M 120 500 L 200 370 L 600 370 L 680 500 Z" fill="url(#deskGrad)" opacity="0.95"/>
  <line x1="120" y1="375" x2="680" y2="375" stroke="#f59e0b" stroke-width="3"/>

  <!-- Teacher / Ustadzah Silhouette Presenting -->
  <g transform="translate(160, 240)">
    <!-- Hijab & Dress -->
    <path d="M 40 180 C 40 120, 60 100, 80 100 C 100 100, 120 120, 120 180 Z" fill="#065f46"/>
    <!-- Head & Hijab -->
    <ellipse cx="80" cy="70" rx="26" ry="32" fill="#065f46"/>
    <ellipse cx="80" cy="72" rx="16" ry="18" fill="#fddec0"/>
    <polygon points="76,82 84,82 80,92" fill="#d97706"/>
    <!-- Arm gesturing towards screen -->
    <path d="M 95 110 Q 140 90 170 85" stroke="#065f46" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Santri Laptop / Tablets on table -->
  <rect x="330" y="385" width="80" height="50" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="340,385 400,385 410,410 330,410" fill="#64748b"/>
  <rect x="470" y="390" width="75" height="48" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Badge Overlay on Bottom Corner -->
  <g transform="translate(480, 415)">
    <rect width="280" height="65" rx="12" fill="rgba(6, 78, 59, 0.95)" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="28" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13">LINGKUNGAN BELAJAR ASRI</text>
    <text x="20" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">Aktif, Kolaboratif & Religius</text>
  </g>
</svg>
