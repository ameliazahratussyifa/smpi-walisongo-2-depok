<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Masuk Terproteksi - {{ school.nama }}</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0284c7">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/images/logo-sekolah.png">

  <!-- Core Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #0369a1 0%, #0c4a6e 45%, #082f49 100%);
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Security Grid & Glow Background Effect */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 70%),
        linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
      pointer-events: none;
      z-index: 1;
    }

    .ambient-glow-1 {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    .ambient-glow-2 {
      position: absolute;
      bottom: -150px;
      right: 5%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    /* Isolated High-Security Card */
    .login-card {
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 28px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(16, 185, 129, 0.25),
        0 0 40px rgba(6, 78, 59, 0.2);
      padding: 2.5rem 2.25rem;
      transition: all 0.3s ease;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 2rem 1.5rem;
        border-radius: 22px;
      }
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(6, 78, 59, 0.07);
      border: 1px solid rgba(6, 78, 59, 0.15);
      color: #064e3b;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .brand-crest {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #064e3b 0%, #047857 100%);
      border-radius: 20px;
      box-shadow: 0 12px 24px rgba(6, 78, 59, 0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fbbf24;
      margin-bottom: 1rem;
    }

    .brand-crest img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: #94a3b8;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 1rem 0 2.85rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 0.925rem;
      color: #0f172a;
      background: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.2);
    }

    .btn-toggle-pass {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.05rem;
      color: #64748b;
      padding: 0.25rem;
      display: flex;
      align-items: center;
    }

    .btn-login {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.35);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(2, 132, 199, 0.45);
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    /* Quick Demo Account Selector */
    .quick-selector {
      background: #f0f9ff;
      border: 1px dashed #bae6fd;
      border-radius: 14px;
      padding: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .quick-btn {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.55rem 0.65rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quick-btn:hover {
      border-color: #0284c7;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.15);
    }

    .alert-box {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #94a3b8;
      font-size: 0.825rem;
      font-weight: 600;
      text-decoration: none;
      margin-top: 1.5rem;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: #34d399;
    }

    .security-footer {
      margin-top: 1.5rem;
      text-align: center;
      color: #64748b;
      font-size: 0.75rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Ambient Light Effects -->
  <div class="bg-grid"></div>
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <div class="login-container">
    
    <!-- Focused Security Card -->
    <div class="login-card">
      
      <!-- Logo & Title -->
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <div class="brand-crest">
          <img src="/static/images/logo-sekolah.png" alt="Logo SMP Islam Walisongo 2" style="object-fit: contain;">
        </div>
        <div>
          <span class="security-badge">
            🔒 SISTEM OTORISASI AMAN • SHA-256 & HMAC
          </span>
        </div>
        <h1 style="font-size: 1.45rem; font-weight: 800; color: #0f172a; margin-bottom: 0.25rem;">
          Portal Masuk Petugas
        </h1>
        <p style="font-size: 0.825rem; color: #64748b;">
          {{ school.nama }}
        </p>
      </div>

      <!-- Alert Box -->
      <div id="loginAlert" class="alert-box"></div>

      <!-- Quick Fill Credentials Box -->
      <div class="quick-selector">
        <div style="font-size: 0.72rem; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.35rem;">
          <span>⚡</span> Klik untuk Isi Otomatis Kredensial:
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
          <button type="button" class="quick-btn" onclick="autoFill('master')">
            <div style="font-size: 0.78rem; font-weight: 800; color: #b45309; display: flex; align-items: center; gap: 0.25rem;">
              👑 Akun Master
            </div>
            <div style="font-size: 0.68rem; color: #64748b; margin-top: 2px;">
              Super Admin (Otoritas & Log)
            </div>
          </button>

          <button type="button" class="quick-btn" onclick="autoFill('admin')">
            <div style="font-size: 0.78rem; font-weight: 800; color: #065f46; display: flex; align-items: center; gap: 0.25rem;">
              🛡️ Akun Admin
            </div>
            <div style="font-size: 0.68rem; color: #64748b; margin-top: 2px;">
              Staf TU & CMS Sekolah
            </div>
          </button>
        </div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        
        <!-- Username -->
        <div class="form-group">
          <label class="form-label">Nama Pengguna (Username)</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="usernameInput" name="username" class="form-input" placeholder="Ketik 'master' atau 'admin'" required autocomplete="username" spellcheck="false">
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label">Kata Sandi (Password)</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="passwordInput" name="password" class="form-input" style="padding-right: 2.75rem;" placeholder="Masukkan kata sandi..." required autocomplete="current-password">
            <button type="button" class="btn-toggle-pass" onclick="togglePasswordVisibility()" title="Lihat/Sembunyikan Sandi">
              <span id="togglePassIcon">👁️</span>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.8rem;">
          <label style="display: flex; align-items: center; gap: 0.4rem; color: #475569; cursor: pointer; user-select: none;">
            <input type="checkbox" id="rememberMe" checked style="accent-color: #064e3b; width: 16px; height: 16px;">
            Ingat sesi di perangkat ini
          </label>
          <a href="https://wa.me/{{ school.whatsapp.replace(' ', '').replace('+', '').replace('-', '') }}?text=Halo%20Admin%20IT,%20saya%20memerlukan%20bantuan%20akses%20portal%20sekolah." target="_blank" style="color: #059669; font-weight: 700; text-decoration: none;">
            Bantuan Akses?
          </a>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btnSubmitLogin" class="btn-login">
          <span id="btnSubmitText">Masuk ke Sistem Otoritas ➔</span>
          <span id="btnSubmitSpinner" style="display: none;">Memvalidasi Kredensial...</span>
        </button>

      </form>

    </div>

    <!-- Clean Back Navigation -->
    <div style="text-align: center;">
      <a href="/" class="back-link">
        ← Kembali ke Website Utama SMP Islam Walisongo 2
      </a>
      <div class="security-footer">
        Akses terlindungi protokol HMAC-SHA256 • IP dicatat untuk audit keamanan<br>
        © 2026 SMP Islam Walisongo 2 Depok
      </div>
    </div>

  </div>

  <script>
    function autoFill(type) {
      const userInp = document.getElementById('usernameInput');
      const passInp = document.getElementById('passwordInput');

      if (type === 'master') {
        userInp.value = 'master';
        passInp.value = 'MasterWalisongo2026!';
        showAlert('Kredensial Akun Master (Super Admin: Pengelolaan Role & Audit Log) terisi.', 'info');
      } else if (type === 'admin') {
        userInp.value = 'admin';
        passInp.value = 'AdminWalisongo2026!';
        showAlert('Kredensial Akun Admin (Staf TU: CMS & PPDB Sekolah) terisi.', 'info');
      }
      userInp.focus();
    }

    function togglePasswordVisibility() {
      const passInp = document.getElementById('passwordInput');
      const icon = document.getElementById('togglePassIcon');
      if (passInp.type === 'password') {
        passInp.type = 'text';
        icon.textContent = '🙈';
      } else {
        passInp.type = 'password';
        icon.textContent = '👁️';
      }
    }

    function showAlert(message, type = 'error') {
      const alertBox = document.getElementById('loginAlert');
      alertBox.style.display = 'block';

      if (type === 'error') {
        alertBox.style.background = '#fef2f2';
        alertBox.style.border = '1px solid #fecaca';
        alertBox.style.color = '#991b1b';
        alertBox.innerHTML = `⚠️ <strong>Akses Ditolak:</strong> ${message}`;
      } else if (type === 'success') {
        alertBox.style.background = '#f0fdf4';
        alertBox.style.border = '1px solid #bbf7d0';
        alertBox.style.color = '#166534';
        alertBox.innerHTML = `✅ <strong>Berhasil:</strong> ${message}`;
      } else if (type === 'info') {
        alertBox.style.background = '#eff6ff';
        alertBox.style.border = '1px solid #bfdbfe';
        alertBox.style.color = '#1e40af';
        alertBox.innerHTML = `💡 ${message}`;
      }
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();

      const userInp = document.getElementById('usernameInput');
      const passInp = document.getElementById('passwordInput');
      const btn = document.getElementById('btnSubmitLogin');
      const btnText = document.getElementById('btnSubmitText');
      const btnSpinner = document.getElementById('btnSubmitSpinner');

      const username = userInp.value.trim();
      const password = passInp.value;

      if (!username || !password) {
        showAlert('Nama pengguna dan kata sandi wajib diisi!');
        return;
      }

      btn.disabled = true;
      btn.style.opacity = '0.75';
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        const formData = new FormData();
        formData.append('username', username);
        formData.append('password', password);

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (res.ok && data.status === 'success') {
          showAlert(`Autentikasi terverifikasi. Selamat datang, ${data.user.nama_lengkap}!`, 'success');
          setTimeout(() => {
            // Master goes to /admin/master, Admin goes to /admin (CMS)
            if (data.user.role === 'master') {
              window.location.href = '/admin/master';
            } else {
              window.location.href = '/admin';
            }
          }, 600);
        } else {
          showAlert(data.detail || 'Nama pengguna atau kata sandi tidak valid. Silakan coba kembali.');
          btn.disabled = false;
          btn.style.opacity = '1';
          btnText.style.display = 'inline-block';
          btnSpinner.style.display = 'none';
        }
      } catch (err) {
        showAlert('Koneksi ke server terputus. Mohon periksa jaringan Anda.');
        btn.disabled = false;
        btn.style.opacity = '1';
        btnText.style.display = 'inline-block';
        btnSpinner.style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('notice') === 'silakan_login') {
        showAlert('Sesi autentikasi diperlukan. Silakan masuk untuk mengakses panel.', 'info');
      } else if (urlParams.get('notice') === 'logged_out') {
        showAlert('Sesi Anda telah aman diakhiri (Logged out).', 'info');
      } else if (urlParams.get('notice') === 'unauthorized_master') {
        showAlert('Akses ditolak: Anda harus memiliki hak akses Master Administrator untuk halaman tersebut.', 'error');
      }
    });
  </script>
</body>
</html>
